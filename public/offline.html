<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClickCargo — Sin conexión</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #060F0F;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    img { width: 72px; height: 72px; margin-bottom: 16px; border-radius: 16px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #9CA3AF; margin: 0 0 20px; }
    button {
      background: #1A2B4B;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="ClickCargo" />
  <h1>Sin conexión</h1>
  <p>No pudimos conectar con ClickCargo. Revisá tu conexión a internet.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
